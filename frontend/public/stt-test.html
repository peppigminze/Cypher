<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Cypher STT Test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #05070d;
        color: #e6e8ef;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 {
        font-size: 1.3rem;
      }
      p.hint {
        color: #8b90a3;
        font-size: 0.85rem;
      }
      label {
        display: block;
        margin-top: 12px;
        font-size: 0.85rem;
        color: #a8adc0;
      }
      input {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        background: #10131d;
        border: 1px solid #2a2f42;
        border-radius: 6px;
        color: #e6e8ef;
        box-sizing: border-box;
      }
      button {
        margin-top: 20px;
        padding: 12px 20px;
        font-size: 1rem;
        border-radius: 8px;
        border: none;
        cursor: pointer;
      }
      #recordBtn {
        background: #3d6bff;
        color: white;
      }
      #recordBtn.recording {
        background: #ff4d4d;
      }
      #recordBtn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        margin-top: 16px;
        font-size: 0.9rem;
        color: #a8adc0;
      }
      #result {
        margin-top: 20px;
        padding: 16px;
        background: #10131d;
        border: 1px solid #2a2f42;
        border-radius: 8px;
        white-space: pre-wrap;
        min-height: 40px;
      }
      audio {
        margin-top: 16px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Cypher - lokaler STT-Test (faster-whisper)</h1>
    <p class="hint">
      Standalone-Testseite, unabhängig von useVoiceInput.ts/der Chat-App. Nimmt Mikrofonaudio auf, schickt es an
      POST /transcribe und zeigt den erkannten Text an.
    </p>

    <label for="backendUrl">Backend-URL</label>
    <input id="backendUrl" value="http://localhost:8000" />

    <label for="token">USER_TOKEN (Bearer)</label>
    <input id="token" value="change-me-user-token" />

    <button id="recordBtn">Aufnahme starten</button>

    <div id="status">Bereit.</div>
    <audio id="playback" controls hidden></audio>
    <div id="result"></div>

    <script>
      const recordBtn = document.getElementById("recordBtn");
      const statusEl = document.getElementById("status");
      const resultEl = document.getElementById("result");
      const playback = document.getElementById("playback");
      const backendUrlInput = document.getElementById("backendUrl");
      const tokenInput = document.getElementById("token");

      let mediaRecorder = null;
      let chunks = [];
      let isRecording = false;

      async function startRecording() {
        resultEl.textContent = "";
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = [];
        // webm/opus is what Chrome/Edge/Firefox record by default - faster-whisper
        // decodes it directly via PyAV, no client-side conversion needed.
        mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
        mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          const blob = new Blob(chunks, { type: "audio/webm" });
          playback.src = URL.createObjectURL(blob);
          playback.hidden = false;
          sendToBackend(blob);
        };
        mediaRecorder.start();
        isRecording = true;
        recordBtn.textContent = "Aufnahme stoppen";
        recordBtn.classList.add("recording");
        statusEl.textContent = "Aufnahme läuft ...";
      }

      function stopRecording() {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.textContent = "Aufnahme starten";
        recordBtn.classList.remove("recording");
      }

      async function sendToBackend(blob) {
        statusEl.textContent = "Sende an /transcribe ...";
        recordBtn.disabled = true;
        const started = performance.now();

        const formData = new FormData();
        formData.append("audio", blob, "recording.webm");

        try {
          const resp = await fetch(`${backendUrlInput.value.replace(/\/$/, "")}/transcribe`, {
            method: "POST",
            headers: { Authorization: `Bearer ${tokenInput.value}` },
            body: formData,
          });
          const roundtrip = ((performance.now() - started) / 1000).toFixed(2);

          if (!resp.ok) {
            const errText = await resp.text();
            statusEl.textContent = `Fehler (HTTP ${resp.status})`;
            resultEl.textContent = errText;
            return;
          }

          const data = await resp.json();
          statusEl.textContent = `Fertig (Roundtrip inkl. Netzwerk: ${roundtrip}s)`;
          resultEl.textContent =
            `Text: ${data.text}\n\n` +
            `Sprache erkannt: ${data.language}\n` +
            `Audiolänge: ${data.audio_duration_seconds.toFixed(2)}s\n` +
            `Transkriptionszeit (Server): ${data.transcribe_time_seconds.toFixed(2)}s`;
        } catch (err) {
          statusEl.textContent = "Netzwerkfehler - läuft das Backend? CORS erlaubt?";
          resultEl.textContent = String(err);
        } finally {
          recordBtn.disabled = false;
        }
      }

      recordBtn.addEventListener("click", () => {
        if (isRecording) {
          stopRecording();
        } else {
          startRecording().catch((err) => {
            statusEl.textContent = "Mikrofonzugriff fehlgeschlagen.";
            resultEl.textContent = String(err);
          });
        }
      });
    </script>
  </body>
</html>
