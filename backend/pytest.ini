[pytest]
asyncio_mode = auto
testpaths = tests
# Fixed temp folder, cleared by pytest at every start. The default under
# %TEMP%\pytest-of-<user> can hold leftovers of a run as administrator that a
# normal run cannot clean up - pytest then exits with 1 although every test
# passed. Relative to where pytest starts: run it from backend/.
addopts = --basetemp=.pytest_tmp
